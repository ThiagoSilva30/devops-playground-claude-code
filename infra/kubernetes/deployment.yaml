apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-playground
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-playground
  template:
    metadata:
      labels:
        app: devops-playground
    spec:
      containers:
        - name: app
          image: 160071257600.dkr.ecr.us-east-1.amazonaws.com/devops-playground
          ports:
            - containerPort: 8080
