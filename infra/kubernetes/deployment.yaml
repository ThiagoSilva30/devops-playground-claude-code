apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-playground
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-playground
  template:
    metadata:
      labels:
        app: devops-playground
    spec:
      containers:
        - name: app
          image: devops-playground:latest
          ports:
            - containerPort: 8080
